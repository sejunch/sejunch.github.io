site_name: 세준위키
site_description: 세준이 만든 것들을 정리해 두는 위키
site_url: https://sejunch.github.io/
repo_url: https://github.com/sejunch
repo_name: sejunch
copyright: © 2026 세준 · 내용은 자유롭게 가져가도 됩니다

theme:
  name: material
  language: ko
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로

plugins:
  - search:
      # 한글은 조사가 붙어 다녀서 기본 구분자로는 검색이 잘 안 걸린다.
      separator: '[\s​\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes            # 나무위키식 각주
  - def_list
  - tables
  - toc:
      permalink: "¶"
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

nav:
  - 대문: index.md
  - 문서:
      - 세준: 세준.md
      - 한랭: 한랭.md
      - 제타 클론: 제타클론.md
      - 한글 프로그래밍 언어: 한글-프로그래밍-언어.md
  - 분류: 분류.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sejunch
      name: GitHub
